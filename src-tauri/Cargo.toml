[package]
name = "flipon"
version = "0.2.1"
description = "FlipOn — Claude account switcher for the system tray"
authors = ["volodya-korol"]
license-file = "../LICENSE.md"
repository = "https://gitlab.com/volodyakorol48/flipon"
edition = "2024"

[lib]
name = "flipon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
tiny-skia = "0.11"
font8x8 = "0.3"
regex = "1"
which = "7"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
parking_lot = "0.12"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
